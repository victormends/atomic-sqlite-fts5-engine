[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atomic-sqlite-fts5-engine"
version = "0.1.0"
description = "Zero-dependency Python 3.9+ atomic shadow-build SQLite FTS5 indexing and read-only search engine for production incident logs, post-mortems, and runbooks."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
keywords = ["sqlite", "fts5", "full-text-search", "bm25", "atomic-build", "incident-logs", "runbooks"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Text Processing :: Indexing",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
atomic-fts = "atomic_fts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
